services:
  - type: web
    name: magic-maintenance
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://nrswghbpavykirkhfzeg.supabase.co
        sync: false
      - key: SUPABASE_KEY
        value: your-supabase-key
        sync: false
